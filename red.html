<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarence Keith - Portfolio (Red Theme)</title>
    <link rel="icon" type="image/png" href="meimages/mehead favicon.webp">
    <link rel="shortcut icon" type="image/png" href="meimages/mehead favicon.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { 
            --marquee-h: 48px; 
            --bg-primary: #ff0000;
            --bg-secondary: #ff3333;
            --text-primary: #ffffff;
            --text-secondary: #f0f0f0;
            --accent-color: #ffffff;
        }
        
        /* Theme-aware utility classes */
        .theme-text-primary {
            color: var(--text-primary) !important;
        }
        
        .theme-text-secondary {
            color: var(--text-secondary) !important;
        }
        
        .theme-bg-primary {
            background-color: var(--bg-primary) !important;
        }
        
        .theme-bg-secondary {
            background-color: var(--bg-secondary) !important;
        }
        
        .theme-accent {
            color: var(--accent-color) !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col theme-bg-primary theme-text-primary">
    <header class="w-full p-6 sm:p-8 sticky top-0 z-50 bg-[#A30000] shadow-sm">
        <nav class="flex justify-between items-center max-w-7xl mx-auto">
            <div class="flex-1">
                <a class="text-lg font-bold nav-link text-white hover:text-black transition-colors duration-300" href="index.html">Reach out!</a>
            </div>
            <div class="flex-1 text-center">
                <a class="text-3xl font-bold tracking-wider nav-link text-white hover:text-black transition-colors duration-300" href="index.html">Clarence Keith</a>
                <div class="text-sm font-medium tracking-widest text-white/80 mt-1">ARTIST/DESIGNER</div>
            </div>
            <div class="flex-1 flex justify-end space-x-6">
                <a href="https://www.instagram.com/ck.mdvs/" target="_blank" rel="noopener noreferrer" class="instagram-link">
                    <img src="white instagram icon.webp" alt="Instagram" class="w-6 h-6 instagram-icon">
                </a>
            </div>
        </nav>
    </header>

    <main class="flex-grow theme-bg-primary theme-text-primary">
        <section class="h-full flex items-center justify-center relative">
            <div class="text-center">
                <h1 class="text-6xl font-bold mb-8 theme-text-primary">Red Theme Active</h1>
                <p class="text-xl mb-8 theme-text-secondary">This is the red theme version of your portfolio</p>
                <div class="space-y-4">
                    <p class="theme-text-primary">• Background: Bright Red (#ff0000)</p>
                    <p class="theme-text-primary">• Text: White (#ffffff)</p>
                    <p class="theme-text-primary">• Secondary Text: Light Gray (#f0f0f0)</p>
                </div>
                <div class="mt-12">
                    <a href="index.html" class="bg-white text-[#A30000] px-8 py-3 rounded-lg font-semibold text-lg hover:bg-gray-100 transition-colors duration-300">
                        Back to Original Theme
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
